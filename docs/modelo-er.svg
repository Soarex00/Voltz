<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc">
  <title id="title">Modelo E-R do Voltz</title><desc id="desc">Administradores cadastram produtos e respondem avaliações. Clientes avaliam produtos. Quatro tabelas relacionadas por chaves estrangeiras.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#17345c}.heading{font-size:19px;font-weight:700;fill:white}.field{font-size:15px}.label{font-size:14px;font-weight:700}.line{fill:none;stroke:#567393;stroke-width:2}.box{fill:white;stroke:#bfccdc;stroke-width:2}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#567393"/></marker></defs>
  <rect width="1100" height="780" fill="#f4f7fc"/>
  <text x="50" y="44" font-size="28" font-weight="700">Voltz • Modelo entidade-relacionamento</text><text x="50" y="72" font-size="15">PK = chave primária · FK = chave estrangeira · UK = único · IDs em UUID</text>
  <path class="line" d="M350 215 H720" marker-end="url(#arrow)"/><text x="390" y="203" class="label">1 — cadastra — 0..N</text>
  <path class="line" d="M875 383 V480" marker-end="url(#arrow)"/><text x="888" y="434" class="label">1 → 0..N</text><text x="888" y="454" class="label">recebe</text>
  <path class="line" d="M350 578 H720" marker-end="url(#arrow)"/><text x="430" y="565" class="label">1 — envia — 0..N</text>
  <path class="line" d="M350 270 H520 V505 H720" marker-end="url(#arrow)"/><text x="535" y="400" class="label">0..1 → 0..N</text><text x="535" y="422" class="label">responde</text>
  <rect class="box" x="50" y="115" width="300" height="210" rx="12"/><path d="M62 115H338Q350 115 350 127V162H50V127Q50 115 62 115" fill="#1d4ed8"/><text class="heading" x="70" y="146">ADMINS</text>
  <text class="field" x="70" y="190">id · PK</text><text class="field" x="70" y="218">nome</text><text class="field" x="70" y="246">email · UK</text><text class="field" x="70" y="274">password_hash</text><text class="field" x="70" y="302">created_at</text>
  <rect class="box" x="720" y="115" width="330" height="268" rx="12"/><path d="M732 115H1038Q1050 115 1050 127V162H720V127Q720 115 732 115" fill="#1d4ed8"/><text class="heading" x="740" y="146">PRODUCTS</text>
  <text class="field" x="740" y="190">id · PK</text><text class="field" x="740" y="216">admin_id · FK → admins</text><text class="field" x="740" y="242">name / model / image</text><text class="field" x="740" y="268">price · NUMERIC(12,2)</text><text class="field" x="740" y="294">vehicles · JSON</text><text class="field" x="740" y="320">description / destaque</text><text class="field" x="740" y="346">created_at</text>
  <rect class="box" x="50" y="480" width="300" height="240" rx="12"/><path d="M62 480H338Q350 480 350 492V527H50V492Q50 480 62 480" fill="#0891b2"/><text class="heading" x="70" y="511">CLIENTS</text>
  <text class="field" x="70" y="555">id · PK</text><text class="field" x="70" y="583">nome</text><text class="field" x="70" y="611">email · UK</text><text class="field" x="70" y="639">password_hash</text><text class="field" x="70" y="667">profile · JSON</text><text class="field" x="70" y="695">created_at</text>
  <rect class="box" x="720" y="480" width="330" height="240" rx="12"/><path d="M732 480H1038Q1050 480 1050 492V527H720V492Q720 480 732 480" fill="#0891b2"/><text class="heading" x="740" y="511">INTERACTIONS</text>
  <text class="field" x="740" y="554">id · PK</text><text class="field" x="740" y="578">product_id · FK → products</text><text class="field" x="740" y="602">client_id · FK → clients</text><text class="field" x="740" y="626">admin_id · FK → admins (opcional)</text><text class="field" x="740" y="650">rating (1 a 5) / comment</text><text class="field" x="740" y="674">reply / replied_at (opcionais)</text><text class="field" x="740" y="698">created_at</text>
  <text x="50" y="755" font-size="14">Tabela auxiliar sessions: hash do token, expiração e FK para cliente ou administrador.</text>
</svg>
